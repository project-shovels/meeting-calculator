<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG Image — Meeting Cost Calculator</title>
<style>
  :root {
    --green: #2d5a3d;
    --green-dark: #1a3d2a;
    --green-light: #3a7a52;
    --sage: #8B9D83;
    --sage-light: #a8b8a0;
    --cream: #F9F8F3;
    --cream-dark: #f0efe8;
    --white: #ffffff;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1200px;
    height: 630px;
    font-family: var(--font);
    overflow: hidden;
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, var(--green-dark) 0%, var(--green) 62%, var(--green-light) 100%);
    overflow: hidden;
  }

  /* Decorative angled watermark chart shape, bottom-right */
  .watermark {
    position: absolute;
    right: -90px;
    bottom: -110px;
    width: 560px;
    height: 560px;
    border-radius: 50%;
    background: rgba(255,255,255,0.045);
  }

  /* Geometric ascending-bars motif (mirrors the calculator's own chart bars) */
  .watermark-bars {
    position: absolute;
    right: 140px;
    bottom: 90px;
    display: flex;
    align-items: flex-end;
    gap: 22px;
    opacity: 0.16;
    transform: rotate(-4deg);
  }
  .wbar {
    background: var(--cream);
    border-radius: 10px 10px 0 0;
  }
  .wbar1 { width: 46px; height: 120px; }
  .wbar2 { width: 46px; height: 190px; }
  .wbar3 { width: 46px; height: 270px; }
  .wbar4 { width: 46px; height: 340px; }

  /* Subtle bar-chart motif accent, upper right */
  .bars {
    position: absolute;
    top: 72px;
    right: 96px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    opacity: 0.5;
  }
  .bar {
    width: 14px;
    background: var(--sage-light);
    border-radius: 4px 4px 0 0;
  }
  .bar1 { height: 28px; }
  .bar2 { height: 46px; }
  .bar3 { height: 68px; }
  .bar4 { height: 92px; }

  .content {
    position: relative;
    z-index: 2;
    padding: 76px 0 0 84px;
    width: 900px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--sage-light);
    margin-bottom: 26px;
  }

  .eyebrow-emoji {
    font-size: 20px;
    line-height: 1;
  }

  h1 {
    font-size: 74px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.04;
    color: var(--white);
    margin-bottom: 24px;
    max-width: 780px;
  }

  .tagline {
    font-size: 30px;
    font-weight: 500;
    color: var(--cream);
    opacity: 0.92;
    max-width: 680px;
    line-height: 1.4;
    margin-bottom: 46px;
  }

  .tagline strong {
    font-weight: 700;
    color: var(--white);
  }

  .stat-badge {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    background: rgba(249,248,243,0.1);
    border: 1.5px solid rgba(249,248,243,0.28);
    border-radius: 14px;
    padding: 18px 28px;
    backdrop-filter: blur(2px);
  }

  .stat-number {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--white);
    white-space: nowrap;
  }

  .stat-label {
    font-size: 18px;
    font-weight: 500;
    color: var(--sage-light);
    line-height: 1.35;
    max-width: 220px;
  }

  .brand {
    position: absolute;
    left: 84px;
    bottom: 56px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 2;
  }

  .brand-mark {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    color: var(--green-dark);
  }

  .brand-name {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--white);
  }

  .brand-sub {
    font-size: 14px;
    font-weight: 500;
    color: var(--sage-light);
    margin-top: 1px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="watermark"></div>
    <div class="watermark-bars">
      <div class="wbar wbar1"></div>
      <div class="wbar wbar2"></div>
      <div class="wbar wbar3"></div>
      <div class="wbar wbar4"></div>
    </div>

    <div class="bars">
      <div class="bar bar1"></div>
      <div class="bar bar2"></div>
      <div class="bar bar3"></div>
      <div class="bar bar4"></div>
    </div>

    <div class="content">
      <div class="eyebrow"><span class="eyebrow-emoji">📊</span>Free Calculator by CalWizz</div>
      <h1>Meeting Cost<br>Calculator</h1>
      <p class="tagline">How much do your meetings <strong>REALLY</strong> cost? Spoiler: more than you think.</p>
      <div class="stat-badge">
        <span class="stat-number">$37B</span>
        <span class="stat-label">wasted yearly on unproductive meetings</span>
      </div>
    </div>

    <div class="brand">
      <div class="brand-mark">C</div>
      <div>
        <div class="brand-name">CalWizz</div>
        <div class="brand-sub">Calendar Analytics for Teams</div>
      </div>
    </div>
  </div>
</body>
</html>
